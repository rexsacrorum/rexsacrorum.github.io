    evaluation set, also exposed to agents over MCP.
- name: GliderMCP — Creator
  dates: Jan 2026 — Present
  summary: Local MCP servers that give AI coding agents compiler-backed and indexed evidence about a
    codebase - Glider (C#/.NET), TGlider (TypeScript), Scout (code search, Rust), Keep (shared knowledge
    store, Rust), and GliderTrace (.NET runtime evidence, early stage).
  bullets:
  - Glider - Roslyn-powered MCP server for C# navigation, references, call graphs, diagnostics, and
    preview-first refactoring; about 148K NuGet downloads (as of 2026-10-30).
  - Scout (Rust) - incrementally updated local index with literal, regex and fuzzy search, tree-sitter
    declaration and structural search across nine languages, and optional on-device semantic search.
  - Keep (Rust) - HTTP and MCP document store on SQLite with workspaces, role-based access, scoped
    credentials with expiry and revocation, an audit log, and history-preserving schema migrations.
  - Release engineering for native binaries on Linux, macOS and Windows (x64 and arm64) via npm, Homebrew,
    NuGet and Docker Hub, built on a fleet of ephemeral self-hosted GitHub Actions runners.
  - Docker-based harness that runs agents with and without the tools on the same tasks to measure their effect.
