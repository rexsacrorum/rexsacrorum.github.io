projects:
- name: TeoriaYa — Founder
  dates: May 2026 — Present
  summary: Language-learning product for immigrants in Spain - learners practice the driving-license theory
    test in Spanish and tap any word or phrase to see it in their own language. Built end to end with AI agents.
  bullets:
  - Go API (modular monolith with separate HTTP and AI-worker roles), PostgreSQL with sqlc and golang-migrate,
    SvelteKit learner and admin apps.
  - Content pipeline - idempotent import, AI-assisted rewriting, generated images, translations and glossary
    tooltips, each behind a staged human review gate before publishing.
